name: Windows Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Format, lint, test and build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust from rust-toolchain.toml
        run: rustup show
      - name: Normalize formatting for prototype build
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --verbose
      - name: Release build
        run: cargo build --release --verbose
      - name: Upload Windows prototype
        uses: actions/upload-artifact@v4
        with:
          name: FlowRail-Windows-prototype
          path: target/release/flowrail.exe
          if-no-files-found: error
